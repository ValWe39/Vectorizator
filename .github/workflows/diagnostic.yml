name: Diagnostic

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Lundi à 6h (audit hebdomadaire)

# --- Sécurité : permissions minimales + concurrence ---
permissions:
  contents: read  # Conforme à l'Amendement 1 (uniquement lecture)

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true  # Annule les exécutions en cours sur le même ref

jobs:
  # --- Job 1 : Vérification de la constitution (Fail fast) ---
  constitution-compliance:
    name: Conformité constitution (I et II)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0  # Nécessaire pour gitleaks et check diff
          persist-credentials: false  # Sécurité renforcée

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Installer pipx (autorisé par Amendement 2)
        run: |
          set -euo pipefail
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Vérifier la constitution
        run: python .github/workflows/scripts/check_constitution.py

      - name: Vérifier les workflows GitHub Actions
        run: python .github/workflows/scripts/audit_workflows.py .github/workflows/

  # --- Job 2 : Détection de secrets (Gitleaks) ---
  secrets:
    name: Détection de fuites de secrets
    needs: constitution-compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Gitleaks v8.21.2 (autorisé par Amendement 2)
        run: |
          set -euo pipefail
          VERSION=v8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scanner le dépôt (y compris historique)
        run: gitleaks git --verbose --redact .

  # --- Job 3 : Linting Python et Markdown ---
  lint:
    name: Linting code et documentation
    needs: constitution-compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Installer Ruff v0.16.8 (autorisé par Amendement 2)
        run: |
          set -euo pipefail
          pipx install ruff==0.16.8

      - name: Lint Python (exclusions input output Prompts .vibe .specify Licence)
        run: |
          set -euo pipefail
          ruff check . --exclude input/ --exclude output/ --exclude Prompts/ --exclude .vibe/ --exclude .specify/ --exclude Licence
          ruff format --check . --exclude input/ --exclude output/ --exclude Prompts/ --exclude .vibe/ --exclude .specify/ --exclude Licence

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Installer markdownlint-cli2 (autorisé par Amendement 2)
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown (exclusions input output Prompts .vibe .github/workflows Licence)
        run: |
          markdownlint-cli2 '**/*.md' \
            '!input/**' \
            '!output/**' \
            '!Prompts/**' \
            '!.vibe/**' \
            '!.github/workflows/**' \
            '!Licence'

  # --- Job 4 : Audit de sécurité des workflows ---
  workflows-security:
    name: Sécurité des workflows GitHub Actions
    needs: constitution-compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Conforme à l'Amendement 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Installer Zizmor (autorisé par Amendement 2)
        run: |
          set -euo pipefail
          pipx install zizmor

      - name: Auditer les workflows (conforme à l'Amendement 1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # UNIQUEMENT pour Zizmor
        run: zizmor --persona=auditor --min-severity=medium .github/workflows/

      - name: Installer actionlint v1.7.3 (autorisé par Amendement 2)
        run: |
          set -euo pipefail
          VERSION=1.7.3
          curl -sSL "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash" \
            | bash -s -- "${VERSION}" /usr/local/bin

      - name: Vérifier la syntaxe des workflows
        run: actionlint -color

  # --- Job 5 : Audit hebdomadaire (Trivy + pip-audit) ---
  audit:
    name: Audit sécurité hebdomadaire
    needs: constitution-compliance
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Installer pip-audit (autorisé par Amendement 2)
        run: |
          set -euo pipefail
          pipx install pip-audit

      - name: Auditer les dépendances Python
        run: pip-audit -r requirements.txt --strict

      - name: Installer Trivy (autorisé par Amendement 2)
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scanner les vulnérabilités (HIGH/CRITICAL)
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 .
