[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorizator"
version = "0.1.0"
description = "Outil CLI de vectorisation de JSON d'index via l'API Mistral Embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mistralai>=1.0.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.scripts]
vector = "vectorizator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
